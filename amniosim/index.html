<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AmnioSim — simulador educativo de amniocentesis ecoguiada</title>
  <script type="module" crossorigin src="./assets/index-BeR9gA8J.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DVIhJ5vx.css">
</head>
<body>
  <div id="app">
    <!-- escenario principal: ecografía a pantalla completa (V intercambia con la vista externa) -->
    <section id="monitor" class="stage">
      <div class="us-frame">
        <canvas id="cus" width="720" height="580" aria-label="Imagen ecográfica simulada"></canvas>
        <div id="us-overlay"></div>
        <div class="us-console st-panel">
          <label>GAN <input id="gain" type="range" min="0" max="100" value="55"><span id="gain-val">55</span></label>
          <label>PROF <input id="depth" type="range" min="8" max="18" step="1" value="14"><span id="depth-val">14 cm</span></label>
          <label>FOCO <input id="focus" type="range" min="2" max="16" step="0.5" value="7"><span id="focus-val">7 cm</span></label>
          <label class="chk"><input id="labels" type="checkbox"> ETIQ</label>
        </div>
      </div>
    </section>
    <section id="view3d" class="pip">
      <canvas id="c3d"></canvas>
      <div class="viewlabel">VISTA EXTERNA <span id="xray-label" class="muted"></span></div>
      <div id="legend" class="legend"></div>
    </section>
    <div id="vitals" class="st-panel st-vitals"></div>
    <div class="top-actions">
      <button id="btn-progress" class="ghost">Progreso</button>
      <button id="btn-menu" class="ghost">Menú</button>
      <button id="btn-mute" class="ghost" title="Silenciar">🔈</button>
    </div>
    <div id="overlay-host"></div>
    <div id="session-info" class="hidden"></div>
    <div id="log" class="hidden"></div>
  </div>
  <div id="tutorial" class="hidden"></div>
  <div id="modal" class="hidden"></div>
</body>
</html>
