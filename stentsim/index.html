<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StentSim — angioplastia y stent ilíaco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-DYKVRBmc.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BH6f6yFu.css">
    <link rel="stylesheet" href="/assets/glass.css">
    <link rel="stylesheet" href="/assets/sim-glass.css">
</head>
<body>
  <div id="app">
    <section id="screen" class="stage">
      <canvas id="fluoro" width="760" height="760" aria-label="Imagen de fluoroscopia simulada"></canvas>
      <div id="hint" class="hint hidden"></div>
    </section>
    <div id="vitals" class="st-panel st-vitals"></div>
    <aside id="tray" class="st-panel">
      <div class="tray-h">BANDEJA</div>
      <div class="tray-row"><span>Catéter</span><button data-cat="vertebral">Vertebral</button><button data-cat="crossover">Curva inv.</button></div>
      <div class="tray-row"><span>Balón</span><select id="b-d" aria-label="Diámetro del balón"></select><select id="b-l" aria-label="Longitud del balón"></select><button id="load-balloon">Cargar</button></div>
      <div class="tray-row"><span>Stent</span><select id="s-d" aria-label="Diámetro del stent"></select><select id="s-l" aria-label="Longitud del stent"></select><button id="load-stent">Cargar</button></div>
      <div class="tray-row"><button id="remove">Retirar (X)</button><button id="finish" class="primary">Terminar (Enter)</button></div>
    </aside>
    <div class="top-actions"><button id="btn-menu" class="ghost">Menú</button></div>
    <div id="panel"></div>
    <div id="overlay-host"></div>
    <div id="session-info" class="hidden"></div>
    <div id="log" class="hidden"></div>
    <div id="keys" class="hidden"></div>
  </div>
  <div id="modal" class="hidden"></div>
</body>
</html>
